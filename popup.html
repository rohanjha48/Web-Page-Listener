<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --bg:#f3f5f7; --ink:#14212b; --muted:#5b6b78; --line:#d5dde3; --accent:#0f6e8c; --accent-ink:#fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141c22; --ink:#e8eef2; --muted:#93a4b1; --line:#2b3841; --accent:#4fb3d1; --accent-ink:#0b1a21; }
  }
  * { box-sizing: border-box; }
  body { width: 300px; margin: 0; padding: 16px; background: var(--bg); color: var(--ink);
         font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  h1 { font-size: 16px; margin: 0 0 12px; font-weight: 650; }
  label { display: block; color: var(--muted); font-size: 12px; margin: 12px 0 4px; }
  select, input[type=range] { width: 100%; }
  select { padding: 8px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--ink); font: inherit; }
  .row { display: flex; gap: 8px; margin-top: 16px; }
  button { flex: 1; padding: 10px; border-radius: 6px; font: inherit; font-weight: 600; cursor: pointer;
           border: 1px solid var(--line); background: transparent; color: var(--ink); }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); flex: 2; }
  button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #status { margin-top: 12px; min-height: 18px; color: var(--muted); font-size: 12px; }
  #status.error { color: #c0392b; }
  #bar { height: 3px; background: var(--line); border-radius: 2px; margin-top: 10px; overflow: hidden; }
  #fill { height: 100%; width: 0; background: var(--accent); transition: width .3s; }
</style>
</head>
<body>
  <h1>Listen to this page</h1>

  <label for="lang">Listen in</label>
  <select id="lang">
    <option value="en">English</option>
    <option value="hi">हिन्दी (Hindi)</option>
    <option value="kn">ಕನ್ನಡ (Kannada)</option>
    <option value="ta">தமிழ் (Tamil)</option>
    <option value="te">తెలుగు (Telugu)</option>
    <option value="ml">മലയാളം (Malayalam)</option>
    <option value="mr">मराठी (Marathi)</option>
    <option value="bn">বাংলা (Bengali)</option>
    <option value="gu">ગુજરાતી (Gujarati)</option>
    <option value="pa">ਪੰਜਾਬੀ (Punjabi)</option>
    <option value="ur">اردو (Urdu)</option>
    <option value="es">Español</option>
    <option value="fr">Français</option>
    <option value="de">Deutsch</option>
    <option value="pt">Português</option>
    <option value="ru">Русский</option>
    <option value="ar">العربية</option>
    <option value="zh-CN">中文</option>
    <option value="ja">日本語</option>
    <option value="ko">한국어</option>
  </select>

  <label for="rate">Speed</label>
  <input id="rate" type="range" min="0.6" max="1.8" step="0.1" value="1">

  <div class="row">
    <button id="play" class="primary">Read page</button>
    <button id="pause" hidden>Pause</button>
    <button id="stop">Stop</button>
  </div>
  <div id="bar"><div id="fill"></div></div>
  <div id="status" role="status"></div>
  <script src="popup.js"></script>
</body>
</html>
